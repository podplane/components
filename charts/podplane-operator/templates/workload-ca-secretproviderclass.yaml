{{- $config := .Values.podplane.operator.config -}}
{{- $secrets := $config.secrets -}}
{{- $providerName := required "podplane.operator.config.secrets.defaultProvider is required" $secrets.defaultProvider -}}
{{- $provider := get $secrets.providers $providerName | default dict -}}
{{- $kind := required (printf "podplane.operator.config.secrets.providers.%s.kind is required" $providerName) $provider.kind -}}
{{- $keyPrefix := default $config.cluster.id $provider.keyPrefix -}}
# A regular tracked Helm resource: Helm creates custom resources before
# workloads, and upgrades it in place without a pre-upgrade delete window.
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-podplane-operator
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
spec:
{{- if eq $kind "aws" }}
{{- $objectType := required (printf "podplane.operator.config.secrets.providers.%s.objectType is required for aws" $providerName) $provider.objectType -}}
{{- if not (has $objectType (list "secretsmanager" "ssmparameter")) -}}
{{- fail (printf "podplane.operator.config.secrets.providers.%s.objectType must be secretsmanager or ssmparameter" $providerName) -}}
{{- end }}
  provider: aws
  parameters:
    objects: |
      - objectName: {{ printf "/%s/workload-ca-key" (trimAll "/" $keyPrefix) | quote }}
        objectType: {{ $objectType | quote }}
        objectAlias: workload-ca-key
{{- else if eq $kind "gcp" }}
  provider: gcp
  parameters:
    secrets: |
      - resourceName: {{ printf "projects/%s/secrets/%s_workload-ca-key/versions/latest" (required (printf "podplane.operator.config.secrets.providers.%s.projectID is required for gcp" $providerName) $provider.projectID) (trimAll "_" $keyPrefix) | quote }}
        path: workload-ca-key
{{- else }}
{{- fail (printf "podplane.operator.config.secrets.defaultProvider must select an aws or gcp provider, got %q" $kind) }}
{{- end }}
