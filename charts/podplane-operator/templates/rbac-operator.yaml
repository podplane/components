---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "podplane-operator.namePrefix" . }}
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["secrets.podplane.dev"]
    resources: ["secretproviderbindings"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["secrets.podplane.dev"]
    resources: ["secretproviderbindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["secrets.podplane.dev"]
    resources: ["secretproviderbindings/finalizers"]
    verbs: ["update"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["podcertificaterequests/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["certificates.podplane.dev/workload"]
    verbs: ["sign", "attest"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles"]
    resourceNames: ["certificates.podplane.dev:workload:roots"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podplane-operator.namePrefix" . }}
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "podplane-operator.namePrefix" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "podplane-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "podplane-operator.namePrefix" . }}-extension-apiserver-authentication-reader
  namespace: kube-system
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "podplane-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "podplane-operator.namePrefix" . }}-auth-delegator
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "podplane-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
