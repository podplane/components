{{- $policy := .Values.podplane.operator.admissionPolicies.secretProviderClassRestriction | default dict -}}
{{- if ne false ($policy.enabled) }}
{{- $exclude := $policy.excludeNamespacesWithLabel | default dict -}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "podplane-operator.spcRestrictionPolicyName" . }}
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        !has(object.spec.volumes) ||
        object.spec.volumes.all(volume,
          !has(volume.csi) ||
          volume.csi.driver != 'secrets-store.csi.k8s.io' ||
          (
            has(object.spec.serviceAccountName) &&
            object.spec.serviceAccountName != '' &&
            has(volume.csi.volumeAttributes) &&
            'secretProviderClass' in volume.csi.volumeAttributes &&
            volume.csi.volumeAttributes['secretProviderClass'] == object.spec.serviceAccountName
          )
        )
      message: "Secrets Store CSI volumes require an explicit pod serviceAccountName, and secretProviderClass must match it."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "podplane-operator.spcRestrictionBindingName" . }}
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
spec:
  policyName: {{ include "podplane-operator.spcRestrictionPolicyName" . }}
  validationActions: ["Deny", "Audit"]
  matchResources:
{{- if $exclude.enabled }}
    namespaceSelector:
      matchExpressions:
        - key: {{ $exclude.key | default "secrets.podplane.dev/secretproviderclass-restriction-policy" | quote }}
          operator: NotIn
          values:
            - {{ $exclude.value | default "bypass" | quote }}
{{- else }}
    namespaceSelector: {}
{{- end }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "podplane-operator.namePrefix" . }}-reserved-workload-ca-spc-vap
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["secrets-store.csi.x-k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretproviderclasses"]
  validations:
    - expression: >
        !object.spec.parameters.exists(key, value, value.contains('workload-ca-key')) ||
        (object.metadata.namespace == {{ .Release.Namespace | squote }} &&
         object.metadata.name == 'platform-podplane-operator')
      message: "The reserved workload-ca-key may only be referenced by the managed platform-podplane-operator SecretProviderClass."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "podplane-operator.namePrefix" . }}-reserved-workload-ca-spc-vapb
  labels:
{{ include "podplane-operator.labels" . | indent 4 }}
spec:
  policyName: {{ include "podplane-operator.namePrefix" . }}-reserved-workload-ca-spc-vap
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector: {}
