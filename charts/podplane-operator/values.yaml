---
podplane:
  operator:
    namePrefix: platform-podplane-operator
    image:
      repository: ghcr.io/podplane/operator
      tag: "v0.14.0"
      pullPolicy: IfNotPresent
    serviceAccountName: platform-podplane-operator
    googleWorkloadIdentity:
      # Full projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER name.
      provider: ""
    metrics:
      enabled: false
      port: 8080
      service:
        enabled: true
      # NetworkPolicy peers for trusted collectors. Empty denies all metrics
      # ingress. Use BOTH namespaceSelector and podSelector in each peer.
      allowedPeers: []
    aggregatedApiService:
      securePort: 8443
    config:
      cluster:
        id: ""
        spiffe:
          trustDomain: ""
        oidc:
          issuerURL: ""
          clientID: ""
          usernameClaim: email
          groupsClaim: groups
      secrets:
        keyRotation: 6h
        allowSyncToKubernetesSecrets: false
        defaultProvider: ""
        providers: {}
      ingressCertificates:
        provider: ""
        keyPrefix: ""
        checkInterval: 1h
        renewBefore: 720h
        acme: null
        domains: {}
      workloadCertificates:
        caPath: /var/run/podplane/certificates/workload-ca-key
      rbac:
        namespaceGroupBindings: true
    # Additional environment variables for the operator container. Useful for
    # cloud/provider SDK configuration sourced from Kubernetes Secrets,
    # but using volumes for mounting secrets instead is the recommended approach.
    env: []
    envFrom: []
    # Additional volumes and mounts for the operator pod. For example, for
    # OpenBao and Vault provider tokens, mount a Secret at
    # /var/run/podplane/providers/<provider-name>/token.
    extraVolumes: []
    extraVolumeMounts: []
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    apiService:
      enabled: true
      group: secrets-api.podplane.dev
      version: v1beta1
    rbac:
      defaultRoles:
        enabled: true
        namePrefix: platform-podplane-secrets
