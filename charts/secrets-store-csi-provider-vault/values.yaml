---
vault:
  server:
    enabled: false
  injector:
    enabled: false
  csi:
    enabled: true
    image:
      repository: hashicorp/vault-csi-provider
      tag: "1.7.2"
      pullPolicy: IfNotPresent
    daemonSet:
      providersDir: /var/run/secrets-store-csi-providers
    agent:
      enabled: true

podplane:
  secrets:
    # Provider entries can include caCert. The chart renders one ConfigMap per
    # provider CA; callers also mount those ConfigMaps with vault.csi.volumes
    # and vault.csi.volumeMounts so SecretProviderClasses can refer to them
    # with vaultCACertPath.
    providers: {}
