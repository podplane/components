---
vault:
  server:
    enabled: false
  injector:
    enabled: false
  csi:
    enabled: true
    image:
      repository: hashicorp/vault-csi-provider
      tag: "1.7.2"
      pullPolicy: IfNotPresent
    daemonSet:
      providersDir: /var/run/secrets-store-csi-providers
    agent:
      enabled: true
