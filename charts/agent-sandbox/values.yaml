---
namespace:
  create: false
  name: ""

image:
  repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
  tag: "v1.0.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

podAnnotations: {}

podLabels: {}

controller:
  leaderElect: true
  extensions: true
  extraArgs: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

# The controller image runs as UID 65532 and only writes to the API server.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  name: agent-sandbox-controller

metrics:
  serviceMonitor:
    enabled: false
    additionalLabels: {}
    interval: 30s
    scrapeTimeout: ""
  prometheusRule:
    enabled: false
    additionalLabels: {}
    additionalGroups: []
