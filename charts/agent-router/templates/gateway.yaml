#
# Agent Router's dedicated Gateway. This chart's own Envoy Gateway controller
# runs its proxy Deployment in this namespace (GatewayNamespace placement), so
# provider credentials, the extproc sidecar and the Agent Router extension stay
# out of the public ingress controller and DaemonSet. It is cluster-internal: no
# host ports.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-agent-router-gateway
spec:
  gatewayClassName: platform-agent-router
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: platform-agent-router-gateway
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: platform-agent-router-serving
      allowedRoutes:
        namespaces:
          from: All
