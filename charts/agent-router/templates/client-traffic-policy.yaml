---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: platform-agent-router-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform-agent-router-gateway
  connection:
    bufferLimit: {{ .Values.platform.agentRouter.clientTrafficPolicy.connection.bufferLimit | quote }}
