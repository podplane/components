platform:
  agentRouter:
    envoyProxy:
      # Keep in sync with envoy-gateway's gateway-helm.global.images.envoyProxy
      # so both Envoy fleets share one cached image.
      image: docker.io/envoyproxy/envoy:distroless-v1.39.1
ai-gateway-helm:
  envoyGateway:
    namespace: platform-envoy-gateway
  controller:
    fullnameOverride: agent-router
    nodeSelector:
      kubernetes.io/os: linux
    securityContext:
      readOnlyRootFilesystem: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
  extProc:
    enableRedaction: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
