platform:
  agentRouter:
    clientTrafficPolicy:
      connection:
        # Envoy Gateway's 32Ki default is too small for AI requests. This matches
        # upstream AI Gateway's example; tune per-connection buffering for available memory.
        bufferLimit: 50Mi
    # SPIFFE trust domain of agent client certificates. platform-components sets
    # it from podplane-operator's cluster.spiffe.trustDomain.
    spiffeTrustDomain: ""
    # Client certificate (mTLS) authentication of agents connecting to the
    # Gateway, verified against the workload CA that Podplane Operator syncs
    # into the workload-ca ConfigMap. Agents present a Podplane workload
    # certificate (podCertificate projection in the default spiffe mode).
    clientAuthentication:
      # VerifyIfGiven (verify presented certificates but accept clients without
      # one; routes can require one by matching x-forwarded-client-cert),
      # RequireAndVerify or Disabled.
      mode: VerifyIfGiven
      # Workload identities allowed to connect; requires RequireAndVerify. Empty
      # allows any valid Podplane workload certificate. Omit serviceAccount to
      # allow every ServiceAccount in the namespace. For example:
      #   - namespace: team-a
      #     serviceAccount: research-agent
      #   - namespace: team-b
      allowedClients: []
    envoyProxy:
      # Keep in sync with envoy-gateway's gateway-helm.global.images.envoyProxy
      # and the controller TLS sidecar below, so both share one cached image.
      image: docker.io/envoyproxy/envoy:distroless-v1.39.1
    sdsSidecar:
      image:
        repository: ghcr.io/podplane/operator
        tag: "v0.16.0"
        pullPolicy: IfNotPresent
ai-gateway-helm:
  envoyGateway:
    # This chart's own Envoy Gateway controller (gateway-helm below).
    namespace: platform-agent-router
  controller:
    fullnameOverride: agent-router
    service:
      ports:
        - name: mutating-webhook
          protocol: TCP
          port: 9443
          appProtocol: https
          targetPort: 9443
        - name: grpc
          protocol: TCP
          port: 1063
          appProtocol: https
          targetPort: 1163
        - name: http-metrics
          protocol: TCP
          port: 8080
          appProtocol: http
          targetPort: 8080
        - name: ratelimit-xds
          protocol: TCP
          port: 18002
          appProtocol: https
          targetPort: 18003
    # Upstream gRPC listeners and probes stay unchanged inside the Pod.
    # NetworkPolicy prevents peers bypassing these TLS listeners.
    volumes:
      - name: controller-tls-config
        mountPath: /etc/podplane-tls
        configmap:
          name: agent-router-controller-tls
          defaultMode: 420
    # Named entries let image-only overrides preserve arguments and mounts.
    extraContainers:
      controller-tls:
        image: docker.io/envoyproxy/envoy:distroless-v1.39.1
        args: ["-c", "/etc/podplane-tls/envoy.yaml", "--concurrency", "1", "--log-level", "warning"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        readinessProbe:
          tcpSocket:
            port: 1163
        volumeMounts:
          - name: certs
            mountPath: /certs
            readOnly: true
          - name: controller-tls-config
            mountPath: /etc/podplane-tls
            readOnly: true
    mutatingWebhook:
      # The webhook fails closed, so scope it to Agent Router's own proxy fleet.
      # Matching every Envoy Gateway Pod would block the ingress Envoy until
      # the Agent Router controller is running.
      objectSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
          gateway.envoyproxy.io/owning-gateway-name: platform-agent-router-gateway
    nodeSelector:
      kubernetes.io/os: linux
    securityContext:
      readOnlyRootFilesystem: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
  extProc:
    enableRedaction: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
# Agent Router's dedicated Envoy Gateway controller. Envoy Gateway calls its
# extension hooks for every Gateway it translates and fails closed, so sharing
# the ingress controller would block ingress xDS whenever Agent Router is down.
# This controller only serves the platform-agent-router GatewayClass.
gateway-helm:
  crds:
    enabled: false
  global:
    images:
      envoyGateway:
        # Keep in sync with envoy-gateway's chart so both controllers share one
        # cached image.
        image: docker.io/envoyproxy/gateway:v1.9.2
      envoyProxy:
        image: docker.io/envoyproxy/envoy:distroless-v1.39.1
  # In GatewayNamespace mode the topology webhook matches every Pod binding in
  # the cluster. The ingress controller already provides it.
  topologyInjector:
    enabled: false
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/platform-agent-router
      extensionApis:
        enableBackend: true
        enableSDSSecretRef: true
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
      extensionManager:
        hooks:
          xdsTranslator:
            translation:
              listener: {includeAll: true}
              route: {includeAll: true}
              cluster: {includeAll: true}
              secret: {includeAll: true}
            post: [Translation, Cluster, Route]
        service:
          # Update the hostname when overriding the controller name or namespace.
          fqdn:
            hostname: agent-router.platform-agent-router.svc.cluster.local
            port: 1063
          # Public CA bundle only, synced by Podplane Operator before this release.
          tls:
            certificateRef:
              kind: Secret
              name: workload-ca
