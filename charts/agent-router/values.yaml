platform:
  agentRouter:
    clientTrafficPolicy:
      connection:
        # Envoy Gateway's 32Ki default is too small for AI requests. This matches
        # upstream AI Gateway's example; tune per-connection buffering for available memory.
        bufferLimit: 50Mi
    envoyProxy:
      # Keep in sync with envoy-gateway's gateway-helm.global.images.envoyProxy
      # so both Envoy fleets share one cached image.
      image: docker.io/envoyproxy/envoy:distroless-v1.39.1
ai-gateway-helm:
  envoyGateway:
    # This chart's own Envoy Gateway controller (gateway-helm below).
    namespace: platform-agent-router
  controller:
    fullnameOverride: agent-router
    mutatingWebhook:
      # The webhook fails closed, so scope it to Agent Router's own proxy fleet.
      # Matching every Envoy Gateway Pod would block the ingress Envoy until
      # the Agent Router controller is running.
      objectSelector:
        matchLabels:
          app.kubernetes.io/managed-by: envoy-gateway
          gateway.envoyproxy.io/owning-gateway-name: platform-agent-router-gateway
    nodeSelector:
      kubernetes.io/os: linux
    securityContext:
      readOnlyRootFilesystem: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
  extProc:
    enableRedaction: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
# Agent Router's dedicated Envoy Gateway controller. Envoy Gateway calls its
# extension hooks for every Gateway it translates and fails closed, so sharing
# the ingress controller would block ingress xDS whenever Agent Router is down.
# This controller only serves the platform-agent-router GatewayClass.
gateway-helm:
  crds:
    enabled: false
  global:
    images:
      envoyGateway:
        # Keep in sync with envoy-gateway's chart so both controllers share one
        # cached image.
        image: docker.io/envoyproxy/gateway:v1.9.2
  # In GatewayNamespace mode the topology webhook matches every Pod binding in
  # the cluster. The ingress controller already provides it.
  topologyInjector:
    enabled: false
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/platform-agent-router
      extensionApis:
        enableBackend: true
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
      extensionManager:
        hooks:
          xdsTranslator:
            translation:
              listener: {includeAll: true}
              route: {includeAll: true}
              cluster: {includeAll: true}
              secret: {includeAll: true}
            post: [Translation, Cluster, Route]
        service:
          fqdn:
            hostname: agent-router.platform-agent-router.svc.cluster.local
            port: 1063
