ai-gateway-helm:
  envoyGateway:
    namespace: platform-envoy-gateway
  controller:
    fullnameOverride: agent-router
    nodeSelector:
      kubernetes.io/os: linux
    securityContext:
      readOnlyRootFilesystem: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
  extProc:
    enableRedaction: true
    extraEnvVars:
      - name: DISABLE_PPROF
        value: "true"
