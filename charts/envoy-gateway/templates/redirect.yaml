{{- if and .Values.platform.envoyGateway.ingress.enabled .Values.platform.envoyGateway.ingress.httpToHTTPSRedirect.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-http-to-https-redirect-httproute
spec:
  parentRefs:
    - name: platform-envoy-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
