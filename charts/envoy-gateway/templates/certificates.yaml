{{- if .Values.platform.envoyGateway.ingress.enabled }}
{{- $certs := .Values.platform.envoyGateway.ingress.certificates -}}
{{- $provider := required "platform.envoyGateway.ingress.certificates.provider is required" $certs.provider -}}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-envoy-gateway-ingress-certificates
spec:
{{- if eq $provider "aws" }}
{{- $objectType := required "platform.envoyGateway.ingress.certificates.objectType is required for aws" $certs.objectType -}}
{{- if not (has $objectType (list "secretsmanager" "ssmparameter")) -}}
{{- fail "platform.envoyGateway.ingress.certificates.objectType must be secretsmanager or ssmparameter" -}}
{{- end }}
  provider: aws
  parameters:
    objects: |
{{- range .Values.platform.envoyGateway.ingress.domains }}
      - objectName: {{ printf "/%s/platform-cluster/ingress-certificates/%s" (trimAll "/" $certs.keyPrefix) (include "podplane.envoyGateway.bundle" .) | quote }}
        objectType: {{ $objectType | quote }}
        objectAlias: {{ include "podplane.envoyGateway.bundle" . | quote }}
{{- end }}
{{- else if eq $provider "gcp" }}
  provider: gcp
  parameters:
    secrets: |
{{- range .Values.platform.envoyGateway.ingress.domains }}
      - resourceName: {{ printf "projects/%s/secrets/%s_platform-cluster_ingress-certificates_%s/versions/latest" (required "platform.envoyGateway.ingress.certificates.projectID is required for gcp" $certs.projectID) (trimAll "_" $certs.keyPrefix) (include "podplane.envoyGateway.bundle" .) | quote }}
        path: {{ include "podplane.envoyGateway.bundle" . | quote }}
{{- end }}
{{- else if eq $provider "vault" }}
  provider: vault
  parameters:
    vaultAddress: {{ required "platform.envoyGateway.ingress.certificates.address is required for vault" $certs.address | quote }}
    vaultAuthMountPath: {{ $certs.authMountPath | default "kubernetes" | quote }}
{{- with $certs.caCertPath }}
    vaultCACertPath: {{ . | quote }}
{{- end }}
    roleName: platform-envoy-gateway-ingress-certificates
    objects: |
{{- range .Values.platform.envoyGateway.ingress.domains }}
      - objectName: {{ include "podplane.envoyGateway.bundle" . | quote }}
        secretPath: {{ printf "%s/data/%s/platform-cluster/ingress-certificates/%s" ($certs.mountPath | default "secret" | trimAll "/") (trimAll "/" $certs.keyPrefix) (include "podplane.envoyGateway.bundle" .) | quote }}
        secretKey: value
{{- end }}
{{- else if eq $provider "openbao" }}
  provider: openbao
  parameters:
    baoAddress: {{ required "platform.envoyGateway.ingress.certificates.address is required for openbao" $certs.address | quote }}
    baoAuthMountPath: {{ $certs.authMountPath | default "kubernetes" | quote }}
{{- with $certs.caCertPath }}
    baoCACertPath: {{ . | quote }}
{{- end }}
    roleName: platform-envoy-gateway-ingress-certificates
    objects: |
{{- range .Values.platform.envoyGateway.ingress.domains }}
      - objectName: {{ include "podplane.envoyGateway.bundle" . | quote }}
        secretPath: {{ printf "%s/data/%s/platform-cluster/ingress-certificates/%s" ($certs.mountPath | default "secret" | trimAll "/") (trimAll "/" $certs.keyPrefix) (include "podplane.envoyGateway.bundle" .) | quote }}
        secretKey: value
{{- end }}
{{- else }}
{{- fail "platform.envoyGateway.ingress.certificates.provider must be aws, gcp, vault, or openbao" }}
{{- end }}
{{- range .Values.platform.envoyGateway.ingress.domains }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "podplane.envoyGateway.bundle" . }}
type: gateway.envoyproxy.io/sds
stringData:
  url: unix:///var/run/podplane-sds/sds.sock
  secretName: {{ include "podplane.envoyGateway.bundle" . }}
{{- end }}
{{- end }}
