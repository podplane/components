{{- if .Values.platform.envoyGateway.ingress.enabled }}
{{- $ingress := .Values.platform.envoyGateway.ingress -}}
{{- if not $ingress.domains }}{{ fail "platform.envoyGateway.ingress.domains must contain at least one domain when ingress is enabled" }}{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform-envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDaemonSet:
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  securityContext:
                    runAsNonRoot: true
                    fsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: envoy
                      ports:
                        - name: http-80
                          containerPort: 10080
                          hostPort: 80
                        - name: https-443
                          containerPort: 10443
                          hostPort: 443
                      volumeMounts:
                        - name: podplane-sds
                          mountPath: /var/run/podplane-sds
                    - name: podplane-sds
                      image: {{ printf "%s:%s" .Values.platform.envoyGateway.sdsSidecar.image.repository .Values.platform.envoyGateway.sdsSidecar.image.tag | quote }}
                      imagePullPolicy: {{ .Values.platform.envoyGateway.sdsSidecar.image.pullPolicy }}
                      args:
                        - sds
                        - --socket=/var/run/podplane-sds/sds.sock
                        - --certificates-dir=/var/run/podplane/ingress-certificates
{{- range $ingress.domains }}
                        - {{ printf "--certificate=%s=%s" (include "podplane.envoyGateway.bundle" .) (include "podplane.envoyGateway.apex" .) | quote }}
{{- end }}
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: ["ALL"]
                        readOnlyRootFilesystem: true
                        runAsNonRoot: true
                        runAsUser: 65532
                        runAsGroup: 65532
                        seccompProfile:
                          type: RuntimeDefault
                      volumeMounts:
                        - name: podplane-sds
                          mountPath: /var/run/podplane-sds
                        - name: ingress-certificates
                          mountPath: /var/run/podplane/ingress-certificates
                          readOnly: true
                  volumes:
                    - name: podplane-sds
                      emptyDir: {}
                    - name: ingress-certificates
                      csi:
                        driver: secrets-store.csi.k8s.io
                        readOnly: true
                        volumeAttributes:
                          secretProviderClass: platform-envoy-gateway-ingress-certificates
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-envoy-gateway
spec:
  gatewayClassName: platform-envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: platform-envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
{{- range $ingress.domains }}
{{- $apex := include "podplane.envoyGateway.apex" . }}
{{- $suffix := include "podplane.envoyGateway.listenerSuffix" . }}
    - name: {{ printf "https-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ $apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "podplane.envoyGateway.bundle" . }}
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ printf "https-wildcard-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ printf "*.%s" $apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "podplane.envoyGateway.bundle" . }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
