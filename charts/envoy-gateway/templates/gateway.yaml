{{- if .Values.platform.envoyGateway.ingress.enabled }}
{{- $ingress := .Values.platform.envoyGateway.ingress -}}
{{- $provider := $ingress.certificates.provider -}}
{{- if not $ingress.domains }}{{ fail "platform.envoyGateway.ingress.domains must contain at least one domain when ingress is enabled" }}{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-envoy-gateway
spec:
  gatewayClassName: platform-envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: platform-envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
{{- range $ingress.domains }}
{{- $apex := include "podplane.envoyGateway.apex" . }}
{{- $suffix := include "podplane.envoyGateway.listenerSuffix" . }}
    - name: {{ printf "https-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ $apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ if eq $provider "node" }}node{{ else }}{{ include "podplane.envoyGateway.bundle" . }}{{ end }}
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ printf "https-wildcard-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ printf "*.%s" $apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ if eq $provider "node" }}node{{ else }}{{ include "podplane.envoyGateway.bundle" . }}{{ end }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
