{{- if .Values.platform.envoyGateway.ingress.enabled }}
{{- $ingress := .Values.platform.envoyGateway.ingress -}}
{{- $provider := $ingress.certificates.provider -}}
{{- if not $ingress.domains }}{{ fail "platform.envoyGateway.ingress.domains must contain at least one domain when ingress is enabled" }}{{- end }}
{{- $envoyProxyImage := required "gateway-helm.global.images.envoyProxy.image is required" (dig "global" "images" "envoyProxy" "image" "" (index .Values "gateway-helm")) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-envoy-gateway-ingress-certificates
automountServiceAccountToken: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform-envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: ClusterIP
      envoyDaemonSet:
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                metadata:
                  annotations:
                    # Under gVisor each container gets its own view of an
                    # emptyDir, so a socket bound by one is invisible to the
                    # other. Share the SDS socket volume across the Pod.
                    dev.gvisor.spec.mount.podplane-sds.share: pod
                    dev.gvisor.spec.mount.podplane-sds.type: tmpfs
                    dev.gvisor.spec.mount.podplane-sds.options: rw,rprivate
                    # Agent Router injects this socket when AI/MCP routes attach.
                    dev.gvisor.spec.mount.ai-gateway-extproc-uds.share: pod
                    dev.gvisor.spec.mount.ai-gateway-extproc-uds.type: tmpfs
                    dev.gvisor.spec.mount.ai-gateway-extproc-uds.options: rw,rprivate
                spec:
                  serviceAccountName: platform-envoy-gateway-ingress-certificates
                  tolerations:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
                      effect: NoSchedule
                    - key: node-role.kubernetes.io/master
                      operator: Exists
                      effect: NoSchedule
                  securityContext:
                    runAsNonRoot: true
                    fsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: envoy
                      image: {{ $envoyProxyImage | quote }}
                      ports:
                        - name: http-80
                          containerPort: 10080
                          hostPort: 80
                        - name: https-443
                          containerPort: 10443
                          hostPort: 443
                      volumeMounts:
                        - name: podplane-sds
                          mountPath: /var/run/podplane-sds
                    - name: podplane-sds
                      image: {{ printf "%s:%s" .Values.platform.envoyGateway.sdsSidecar.image.repository .Values.platform.envoyGateway.sdsSidecar.image.tag | quote }}
                      imagePullPolicy: {{ .Values.platform.envoyGateway.sdsSidecar.image.pullPolicy }}
                      args:
                        - sds
                        - --socket=/var/run/podplane-sds/sds.sock
{{- if eq $provider "node" }}
{{- $domains := list }}
{{- range $ingress.domains }}
{{- $domains = append $domains (include "podplane.envoyGateway.apex" .) }}
{{- end }}
                        - {{ printf "--node-certificate=%s" (join "," $domains) | quote }}
{{- else }}
{{- range $ingress.domains }}
                        - {{ printf "--domain-certificate=%s=%s" (include "podplane.envoyGateway.bundle" .) (include "podplane.envoyGateway.apex" .) | quote }}
{{- end }}
{{- end }}
                      securityContext:
                        allowPrivilegeEscalation: false
                        capabilities:
                          drop: ["ALL"]
                        readOnlyRootFilesystem: true
                        runAsNonRoot: true
                        runAsUser: 65532
                        runAsGroup: 65532
                        seccompProfile:
                          type: RuntimeDefault
                      volumeMounts:
                        - name: podplane-sds
                          mountPath: /var/run/podplane-sds
                        - name: ingress-certificates
                          mountPath: /var/run/podplane/ingress-certificates
                          readOnly: true
                  volumes:
                    - name: certs
                      configMap: null
                      projected:
                        sources:
                          - clusterTrustBundle:
                              name: certificates.podplane.dev:workload:roots
                              path: ca.crt
                    - name: podplane-sds
                      emptyDir:
                        medium: Memory
                    - name: ingress-certificates
{{- if eq $provider "node" }}
                      hostPath:
                        path: /opt/podplane/secrets/ingress
                        type: Directory
{{- else }}
                      csi:
                        driver: secrets-store.csi.k8s.io
                        readOnly: true
                        volumeAttributes:
                          secretProviderClass: platform-envoy-gateway-ingress-certificates
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-envoy-gateway
spec:
  gatewayClassName: platform-envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: platform-envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
{{- range $ingress.domains }}
{{- $apex := include "podplane.envoyGateway.apex" . }}
{{- $suffix := include "podplane.envoyGateway.listenerSuffix" . }}
    - name: {{ printf "https-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ $apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ if eq $provider "node" }}node{{ else }}{{ include "podplane.envoyGateway.bundle" . }}{{ end }}
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ printf "https-wildcard-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ printf "*.%s" $apex | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ if eq $provider "node" }}node{{ else }}{{ include "podplane.envoyGateway.bundle" . }}{{ end }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
{{- end }}
