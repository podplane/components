---
# https://github.com/piraeusdatastore/helm-charts/blob/main/charts/snapshot-controller/values.yaml
snapshot-controller:
  controller:
    fullnameOverride: platform-snapshot-controller
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
    args:
      leaderElection: true
      leaderElectionNamespace: "$(NAMESPACE)"
      httpEndpoint: ":8080"
      featureGates: "CSIVolumeGroupSnapshot=true"
