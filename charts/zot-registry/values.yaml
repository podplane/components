---
platform:
  zotRegistry:
    registryHostname: ""
    logLevel: info
    googleWorkloadIdentity:
      # Full provider name; generated cluster values also wire Zot's token volume and ADC env.
      provider: ""
    storage:
      # Object storage driver: s3 (AWS S3 or S3-compatible) or gcs (Google
      # Cloud Storage). Other settings below apply to both drivers unless
      # marked otherwise.
      driver: s3
      bucket: registry
      # Bucket key prefix. Empty stores repositories at the bucket root, where
      # the node-local Podplane registry reads them.
      rootDirectory: ""
      # GCS only: path to a service account key file mounted into the pod.
      # Leave empty for Application Default Credentials.
      keyfile: ""
      # S3 only settings follow.
      region: local
      endpoint: ""
      forcePathStyle: false
      secure: true
      skipVerify: false
      # Static credentials are only for local fake-S3 development. Production
      # clusters use AWS pod role annotations or Google Workload Identity Federation.
      accessKeyID: ""
      secretAccessKey: ""
    oidc:
      issuer: ""
      audience: ""
      usernameClaim: email
      groupsClaim: groups
      certificateAuthority: ""
      certificateAuthorityFile: ""
    accessControl:
      repositories:
        "**":
          policies:
            - groups:
                - system:masters
                - podplane:admins
                - podplane:editors
                - podplane:operators
                - podplane:viewers
                - podplane:registry:admin
                - podplane:registry:edit
                - podplane:registry:view
              actions: [read]
          defaultPolicy: []
        "apps/**":
          policies:
            - groups:
                - system:masters
                - podplane:admins
                - podplane:registry:admin
              actions: [read, create, update, delete]
            - groups:
                - podplane:editors
                - podplane:operators
                - podplane:registry:edit
              actions: [read, create]
            - groups:
                - podplane:viewers
                - podplane:registry:view
              actions: [read]
          defaultPolicy: []
        "mirror/**":
          policies:
            - groups:
                - podplane:registry:mirror
              actions: [read, create, update, delete]
            - groups:
                - system:masters
                - podplane:admins
                - podplane:editors
                - podplane:operators
                - podplane:viewers
                - podplane:registry:admin
                - podplane:registry:edit
                - podplane:registry:view
              actions: [read]
          defaultPolicy: []

# Upstream project-zot/zot chart values for the workload/service implementation
zot:
  fullnameOverride: zot-registry
  service:
    type: ClusterIP
    port: 5000 # default
  persistence: false # default
  metrics:
    enabled: false # default
    serviceMonitor:
      enabled: false # default
  ingress:
    enabled: false # default
  httproute:
    enabled: false # default
  serviceHeadless:
    enabled: false # default
  mountConfig: false # default
  # The zot image defaults to root; run it as a fixed non-root UID instead. Its
  # only local write is cache.db in the chart's /var/lib/registry emptyDir.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  extraVolumes:
    - name: podplane-zot-config
      configMap:
        name: zot-registry-config
  extraVolumeMounts:
    - name: podplane-zot-config
      mountPath: /etc/zot/config.json
      subPath: config.json
      readOnly: true
