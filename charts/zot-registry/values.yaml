---
platform:
  zotRegistry:
    registryHostname: ""
    logLevel: info
    storage:
      bucket: registry
      region: local
      endpoint: ""
      rootDirectory: ""
      forcePathStyle: false
      secure: true
      skipVerify: false
      # Static credentials are only for local fake-S3 development. Production
      # clusters should use workload identity via zot.serviceAccount.annotations.
      accessKeyID: ""
      secretAccessKey: ""
    oidc:
      issuer: ""
      audience: ""
      usernameClaim: email
      groupsClaim: groups
      certificateAuthority: ""
      certificateAuthorityFile: ""
    accessControl:
      repositories:
        "**":
          policies:
            - groups:
                - system:masters
                - podplane:admins
                - podplane:editors
                - podplane:operators
                - podplane:viewers
                - podplane:registry:admin
                - podplane:registry:edit
                - podplane:registry:view
              actions: [read]
          defaultPolicy: []
        "apps/**":
          policies:
            - groups:
                - system:masters
                - podplane:admins
                - podplane:registry:admin
              actions: [read, create, update, delete]
            - groups:
                - podplane:editors
                - podplane:operators
                - podplane:registry:edit
              actions: [read, create]
            - groups:
                - podplane:viewers
                - podplane:registry:view
              actions: [read]
          defaultPolicy: []
        "mirror/**":
          policies:
            - groups:
                - podplane:registry:mirror
              actions: [read, create, update, delete]
            - groups:
                - system:masters
                - podplane:admins
                - podplane:editors
                - podplane:operators
                - podplane:viewers
                - podplane:registry:admin
                - podplane:registry:edit
                - podplane:registry:view
              actions: [read]
          defaultPolicy: []

# Upstream project-zot/zot chart values for the workload/service implementation
zot:
  fullnameOverride: zot-registry
  service:
    type: ClusterIP
    port: 5000 # default
  persistence: false # default
  metrics:
    enabled: false # default
    serviceMonitor:
      enabled: false # default
  ingress:
    enabled: false # default
  httproute:
    enabled: false # default
  serviceHeadless:
    enabled: false # default
  mountConfig: false # default
  extraVolumes:
    - name: podplane-zot-config
      configMap:
        name: zot-registry-config
  extraVolumeMounts:
    - name: podplane-zot-config
      mountPath: /etc/zot/config.json
      subPath: config.json
      readOnly: true
