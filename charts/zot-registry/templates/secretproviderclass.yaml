{{- with .Values.platform.zotRegistry.storage.googleSecretVersion }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "zot.serviceAccountName" (index $.Subcharts "zot") }}
spec:
  provider: gcp
  parameters:
    auth: provider-adc
    secrets: |
      - resourceName: {{ . | quote }}
        path: credentials.json
{{- end }}
