apiVersion: secrets.podplane.dev/v1beta1
kind: SecretProviderBinding
metadata:
  name: sourcegateway
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.platform.sourceGateway.providerName }}
  providerName: {{ . | quote }}
  {{- end }}
  items:
    - key: encryption-key
      path: encryption-key
