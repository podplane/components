---
openbao:
  server:
    enabled: false
  injector:
    enabled: false
  csi:
    enabled: true
    image:
      registry: quay.io
      repository: openbao/openbao-csi-provider
      tag: "2.0.2"
      pullPolicy: IfNotPresent
    daemonSet:
      providersDir: /etc/kubernetes/secrets-store-csi-providers
    agent:
      enabled: true
