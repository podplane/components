---
openbao:
  server:
    enabled: false
  injector:
    enabled: false
  csi:
    enabled: true
    image:
      registry: quay.io
      repository: openbao/openbao-csi-provider
      tag: "2.0.2"
      pullPolicy: IfNotPresent
    daemonSet:
      providersDir: /etc/kubernetes/secrets-store-csi-providers
    agent:
      enabled: true

podplane:
  secrets:
    # Provider entries can include caCert. The chart renders one ConfigMap per
    # provider CA; callers also mount those ConfigMaps with openbao.csi.volumes
    # and openbao.csi.volumeMounts so SecretProviderClasses can refer to them
    # with baoCACertPath.
    providers: {}
