---
# https://github.com/cert-manager/trust-manager/blob/main/deploy/charts/trust-manager/values.yaml
trust-manager:
  crds:
    enabled: false
  nameOverride: "platform-trust-manager"
  defaultPackage:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  app:
    trust:
      # https://cert-manager.io/docs/trust/trust-manager/
      # note: configmap and secret sources can only come from the 'Trust Namespace'
      namespace: platform-certs
    webhook:
      tls:
        approverPolicy:
          enabled: true
          certManagerNamespace: "platform-cert-manager"
          certManagerServiceAccount: "platform-cert-manager"
      service:
        ipFamilyPolicy: "PreferDualStack"
        ipFamilies:
          - "IPv4"
          - "IPv6"
    metrics:
      service:
        ipFamilyPolicy: "PreferDualStack"
        ipFamilies:
          - "IPv4"
          - "IPv6"
