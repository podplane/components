---
platform:
  rbac:
    admissionPolicies:
      denyEditorShell:
        enabled: true
      denyCiliumExec:
        enabled: true
      reserveNamespacePrefixes:
        enabled: true
      podSecurityDefaults:
        enabled: true
      secretProviderClassRestriction:
        enabled: true
        excludeNamespacesWithLabel:
          enabled: false
          key: secrets.podplane.dev/secretproviderclass-restriction-policy
          value: bypass
