---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-group-operators-crb
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: podplane:operators
# Cluster operators can modify workloads and use operational access such as pod exec.
# For the same permissions without exec/shell access, use the editors role.
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
