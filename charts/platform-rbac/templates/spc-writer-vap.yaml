---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-spc-writer-vap
spec:
  # Shared provider credentials make raw SPCs a platform-admin escape hatch.
  # Ownership labels/references are not authorization: tenants can forge them.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["secrets-store.csi.x-k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secretproviderclasses"]
  validations:
    - expression: >
        request.userInfo.username == 'system:serviceaccount:platform-podplane-operator:platform-podplane-operator' ||
        request.userInfo.username == 'system:serviceaccount:platform-fluxcd:helm-controller' ||
        request.userInfo.groups.exists(group, group == 'podplane:admins' || group == 'system:masters')
      message: "Use SecretProviderBinding to request secrets. Raw SecretProviderClasses are restricted to platform administrators and platform controllers."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-spc-writer-vapb
spec:
  policyName: platform-spc-writer-vap
  validationActions: ["Deny", "Audit"]
