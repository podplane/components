---
platform:
  certs:
    clusterCA:
      commonName: "podplane.local"
    service:
      selfsigned:
        issuerName: platform-service-certificate-clusterissuer
    ingress:
      acme:
        enabled: false
        issuerName: platform-ingress-acme-clusterissuer
        server: ""
        email: ""
        privateKeySecretName: platform-acme-account-key
        solvers: []
      selfsigned:
        issuerName: platform-ingress-selfsigned-clusterissuer
      dnsNames: []
    secretSync:
      enabled: false
      image:
        repository: docker.io/library/golang
        tag: alpine
      mounts: []
