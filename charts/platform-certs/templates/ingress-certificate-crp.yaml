---
# CertificateRequestPolicy for ingress domains.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: platform-ingress-certificate-crp
spec:
  selector:
    issuerRef:
      kind: ClusterIssuer
      name: platform-ingress-*-clusterissuer
    namespace:
      matchNames:
        - "platform-traefik"
  allowed:
    # Deny commonName - must not be present
    # Platform Traefik owns ingress TLS termination. Permit only the configured
    # apex and wildcard names from its namespace.
    dnsNames:
      required: true
      validations:
        - rule: {{ printf "self in %s" (toJson .Values.platform.certs.ingress.dnsNames) | quote }}
          message: "DNS SAN must be one of the configured ingress names"
    # Restrict to server auth only
    usages:
      - "digital signature"
      - "key encipherment"
      - "server auth"
    # Prevent CA certificates
    isCA: false
    # Allow basic subject fields but not required
    subject:
      organizations: { values: ["*"] }
      countries: { values: ["*"] }
      organizationalUnits: { values: ["*"] }
      localities: { values: ["*"] }
      provinces: { values: ["*"] }
      streetAddresses: { values: ["*"] }
      postalCodes: { values: ["*"] }
      serialNumber: { value: "*" }
