{{- if .Values.platform.certs.secretSync.enabled }}
{{- $sync := .Values.platform.certs.secretSync -}}
{{- if not $sync.mounts }}{{ fail "platform.certs.secretSync.mounts must contain at least one mount when secret sync is enabled" }}{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-certs-secret-sync
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-certs-secret-sync
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-certs-secret-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-certs-secret-sync
    spec:
      serviceAccountName: platform-certs-secret-sync
      containers:
        - name: sync
          image: {{ printf "%s:%s" $sync.image.repository $sync.image.tag | quote }}
          volumeMounts:
{{- range $sync.mounts }}
            - name: {{ required "platform.certs.secretSync.mounts[].name is required" .name }}
              mountPath: {{ required "platform.certs.secretSync.mounts[].mountPath is required" .mountPath | quote }}
              readOnly: true
{{- end }}
      volumes:
{{- range $sync.mounts }}
        - name: {{ required "platform.certs.secretSync.mounts[].name is required" .name }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ required "platform.certs.secretSync.mounts[].secretProviderClassName is required" .secretProviderClassName | quote }}
{{- end }}
{{- end }}
