{{- if .Values.platform.certs.domains }}
{{- $domains := .Values.platform.certs.domains -}}
{{- $conditions := list -}}
{{- range $domain := $domains -}}
{{- $zone := required "platform.certs.domains[].zone is required" $domain.zone -}}
{{- $conditions = append $conditions (printf "self == '%s' || self == '*.%s'" $zone $zone) -}}
{{- end -}}
---
# CertificateRequestPolicy for Traefik ingress domains.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: platform-traefik-ingress-certificate-crp
spec:
  selector:
    namespace:
      matchNames:
        - "platform-traefik"
  allowed:
    # Deny commonName - must not be present
    # Only allow wildcard DNS name pattern
    dnsNames:
      required: true
      validations:
        - rule: {{ join " || " $conditions | quote }}
          message: 'DNS names must match a configured ingress domain apex or wildcard'
    # Restrict to server auth only
    usages:
      - "digital signature"
      - "key encipherment"
      - "server auth"
    # Prevent CA certificates
    isCA: false
    # Allow basic subject fields but not required
    subject:
      organizations: { values: ["*"] }
      countries: { values: ["*"] }
      organizationalUnits: { values: ["*"] }
      localities: { values: ["*"] }
      provinces: { values: ["*"] }
      streetAddresses: { values: ["*"] }
      postalCodes: { values: ["*"] }
      serialNumber: { value: "*" }
{{- end }}
