---
# CertificateRequestPolicy for Traefik ingress domains.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: platform-traefik-ingress-certificate-crp
spec:
  selector:
    namespace:
      matchNames:
        - "platform-traefik"
  allowed:
    # Deny commonName - must not be present
    # Platform Traefik owns ingress TLS termination; allow any DNS name from
    # this namespace while keeping CA and client certificate issuance blocked.
    dnsNames:
      required: true
      values: ["*"]
    # Restrict to server auth only
    usages:
      - "digital signature"
      - "key encipherment"
      - "server auth"
    # Prevent CA certificates
    isCA: false
    # Allow basic subject fields but not required
    subject:
      organizations: { values: ["*"] }
      countries: { values: ["*"] }
      organizationalUnits: { values: ["*"] }
      localities: { values: ["*"] }
      provinces: { values: ["*"] }
      streetAddresses: { values: ["*"] }
      postalCodes: { values: ["*"] }
      serialNumber: { value: "*" }
