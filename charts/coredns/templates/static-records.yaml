---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-coredns-static-records
  namespace: {{ .Release.Namespace }}
data:
  hosts: |
    {{- range $hostname, $addresses := .Values.platform.coredns.staticRecords }}
    {{- range $addresses }}
    {{ . }} {{ $hostname }}
    {{- end }}
    {{- end }}
