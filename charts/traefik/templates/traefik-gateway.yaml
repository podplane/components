{{- if .Values.platform.traefik.ingress.enabled }}
{{- $ingress := .Values.platform.traefik.ingress -}}
{{- if not $ingress.domains }}{{ fail "platform.traefik.ingress.domains must contain at least one domain when ingress is enabled" }}{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $ingress.gateway.name }}
spec:
  gatewayClassName: {{ $ingress.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
{{- range $ingress.domains }}
{{- $zone := include "podplane.traefik.domainName" . }}
{{- $suffix := include "podplane.traefik.listenerSuffix" . }}
    - name: {{ printf "https-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ $zone | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "podplane.traefik.secretName" . }}
    - name: {{ printf "https-wildcard-%s" $suffix | trunc 63 | trimSuffix "-" }}
      protocol: HTTPS
      port: 443
      hostname: {{ printf "*.%s" $zone | quote }}
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "podplane.traefik.secretName" . }}
{{- end }}
{{- end }}
