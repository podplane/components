---
platform:
  traefik:
    ingress:
      enabled: false
      gateway:
        name: platform-traefik-gateway
        className: platform-traefik
      issuerRef:
        kind: ClusterIssuer
        name: platform-ingress-acme-clusterissuer
      domains: []
      bootstrapTLS:
        enabled: true
        validityDays: 30
        image:
          repository: docker.io/library/golang
          tag: alpine

# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/VALUES.md#values
# https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
traefik:
  global:
    checkNewVersion: false
    sendAnonymousUsage: false
  logs:
    # general:
    #   level: "DEBUG"
    access:
      enabled: false
  deployment:
    kind: DaemonSet
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  service:
    type: NodePort
    ipFamilyPolicy: "PreferDualStack"
    ipFamilies:
      - "IPv4"
      - "IPv6"
  providers:
    kubernetesIngress:
      enabled: false
    kubernetesGateway:
      enabled: true
      experimentalChannel: true
  experimental:
    kubernetesGateway:
      enabled: true
  gateway:
    enabled: false
  gatewayClass:
    enabled: true
    name: "platform-traefik"
  ingressClass:
    enabled: false
  rbac:
    enabled: true
  ports:
    # disable HTTP
    web:
      asDefault: false
      port: 80
      hostPort: 80
    # enable HTTPS
    websecure:
      asDefault: true
      port: 443
      hostPort: 443
    # enable Traefik dashboard and API port
    traefik:
      asDefault: false
      port: 8080
      hostPort: 8080
  # enable routing to Traefik dashboard and API over its 8080 entrypoint/port
  ingressRoute:
    dashboard:
      enabled: true
