{{- $apps := .Values.platform.components.apps -}}
---
# Cluster-wide namespace used as the target for cluster-scoped Helm releases (e.g. CRDs).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-cluster
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/managed-by: Helm
    # Hosts cluster-scoped releases only; no Pods run here.
{{- include "podplane.platform.podSecurityLabels" "restricted" }}
{{ range $name, $app := $apps }}
{{- if and $app.enabled $app.namespace (ne $app.namespace "platform-cluster") }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $app.namespace }}
  annotations:
    helm.sh/resource-policy: keep
{{- with $app.namespaceAnnotations }}
{{ toYaml . | indent 4 }}
{{- end }}
  labels:
    app.kubernetes.io/managed-by: Helm
{{- with $app.podSecurity }}
{{- include "podplane.platform.podSecurityLabels" . }}
{{- end }}
{{- if $app.runcAllowed }}
    runtime.podplane.dev/runc: allowed
{{- end }}
{{- end }}
{{- end }}
