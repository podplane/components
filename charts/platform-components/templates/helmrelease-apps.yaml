{{/*
Podplane <https://podplane.dev>
Copyright The Podplane Authors
SPDX-License-Identifier: Apache-2.0

Renders one Flux HelmRelease per enabled app chart.
Each HelmRelease pulls its chart from the podplane-components GitRepository.
*/}}
{{- $components := .Values.platform.components -}}
{{- $helmRelease := $components.helmRelease | default dict -}}
{{- $interval := $helmRelease.interval | default "10m" -}}
{{- $values := $components.values | default dict -}}
{{- $mirror := $components.imageMirror | default dict -}}
{{- $mirrorEnabled := $mirror.enabled | default false -}}
{{- $mirrorHostname := $mirror.hostname | default "" -}}
{{- $mirrorPrefix := "mirror" -}}
{{- if hasKey $mirror "prefix" -}}{{- $mirrorPrefix = trimAll "/" $mirror.prefix -}}{{- end -}}
{{- $sourceNs := .Release.Namespace -}}

{{ range $name, $entry := $components.apps }}
{{- if $entry.enabled }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ $entry.namespace }}
spec:
  interval: {{ $interval }}
  maxHistory: 3
  releaseName: {{ include "podplane.platform.releaseName" $name }}
  chart:
    spec:
      chart: ./charts/{{ $name }}
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: podplane-components
        namespace: {{ $sourceNs }}
  install:
    crds: Skip
    remediation:
      retries: 10
  upgrade:
    crds: Skip
    remediation:
      retries: 3
{{- with $entry.dependsOn }}
  dependsOn:
{{- range . }}
    - name: {{ . }}
{{- /* CRDs live in platform-cluster; apps live in their own namespace; default to source namespace if unknown */ -}}
{{- $depCrd := index $components.crds . }}
{{- $depApp := index $components.apps . }}
{{- if $depCrd }}
      namespace: platform-cluster
{{- else if $depApp }}
      namespace: {{ $depApp.namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq $name "podplane-operator" }}
{{- $operatorValues := index $values $name | default dict -}}
{{- $secrets := dig "podplane" "operator" "config" "secrets" dict $operatorValues -}}
{{- $providerName := required "platform.components.values.podplane-operator.podplane.operator.config.secrets.defaultProvider is required" (get $secrets "defaultProvider") -}}
{{- $providers := get $secrets "providers" | default dict -}}
{{- $provider := get $providers $providerName | default dict -}}
{{- $providerKind := required (printf "platform.components.values.podplane-operator.podplane.operator.config.secrets.providers.%s.kind is required" $providerName) (get $provider "kind") -}}
{{- if not (has $providerKind (list "aws" "gcp" "openbao")) -}}
{{- fail (printf "podplane-operator workload certificates require an aws, gcp, or openbao default provider, got %q" $providerKind) -}}
{{- end }}
{{- $providerComponent := printf "secrets-store-csi-provider-%s" $providerKind }}
    - name: {{ $providerComponent }}
      namespace: {{ (index $components.apps $providerComponent).namespace }}
{{- end }}
{{ if and (eq $name "envoy-gateway") (dig "platform" "envoyGateway" "ingress" "enabled" false (index $values $name | default dict)) }}
{{- $envoyValues := index $values $name }}
{{- $providerKind := required "platform.components.values.envoy-gateway.platform.envoyGateway.ingress.certificates.provider is required" (dig "platform" "envoyGateway" "ingress" "certificates" "provider" "" $envoyValues) }}
{{- if not (has $providerKind (list "aws" "gcp" "openbao")) -}}
{{- fail (printf "envoy-gateway ingress certificates require an aws, gcp, or openbao provider, got %q" $providerKind) -}}
{{- end }}
{{- $providerComponent := printf "secrets-store-csi-provider-%s" $providerKind }}
    - name: {{ $providerComponent }}
      namespace: {{ (index $components.apps $providerComponent).namespace }}
{{- end }}
{{ include "podplane.platform.values" (dict "name" $name "values" $values "mirrorEnabled" $mirrorEnabled "mirrorHostname" $mirrorHostname "mirrorPrefix" $mirrorPrefix) }}
{{- end }}
{{- end }}
