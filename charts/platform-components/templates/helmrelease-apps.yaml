{{/*
Podplane <https://podplane.dev>
Copyright The Podplane Authors
SPDX-License-Identifier: Apache-2.0

Renders one Flux HelmRelease per enabled app chart.
Each HelmRelease pulls its chart from the podplane-components GitRepository.
*/}}
{{- $components := .Values.platform.components -}}
{{- $helmRelease := $components.helmRelease | default dict -}}
{{- $interval := $helmRelease.interval | default "10m" -}}
{{- $values := deepCopy ($components.values | default dict) -}}
{{- $mirror := $components.imageMirror | default dict -}}
{{- $mirrorEnabled := $mirror.enabled | default false -}}
{{- $mirrorHostname := $mirror.hostname | default "" -}}
{{- $mirrorPrefix := "mirror" -}}
{{- if hasKey $mirror "prefix" -}}{{- $mirrorPrefix = trimAll "/" $mirror.prefix -}}{{- end -}}
{{- $sourceNs := .Release.Namespace -}}

{{/* Agent Router needs its public CA Secret (extension client) and ConfigMap
(agent client certificate validation) before its HelmRelease can start.
The operator creates them, avoiding a dependency on resources in that release.
Keep user-supplied sync targets and honor an explicit policy for these targets. */}}
{{- $agent := index $components.apps "agent-router" | default dict -}}
{{- if $agent.enabled -}}
{{- $agentValues := index $values "agent-router" | default dict -}}
{{- $ref := dig "gateway-helm" "config" "envoyGateway" "extensionManager" "service" "tls" "certificateRef" dict $agentValues -}}
{{- $operatorValues := index $values "podplane-operator" | default dict -}}
{{- $sync := dig "podplane" "operator" "config" "workloadCertificates" "trustBundleSync" dict $operatorValues -}}
{{- $resources := get $sync "resources" | default list -}}
{{- $targets := list
  (dict "kind" "Secret" "namespace" (get $ref "namespace" | default $agent.namespace) "name" (get $ref "name" | default "workload-ca") "key" "tls.crt")
  (dict "kind" "ConfigMap" "namespace" $agent.namespace "name" "workload-ca" "key" "ca.crt")
-}}
{{- range $target := $targets -}}
{{- $found := false -}}
{{- range $resources -}}
{{- if and (eq .kind $target.kind) (eq .namespace $target.namespace) (eq .name $target.name) (eq .key $target.key) -}}
{{- $found = true -}}
{{- end -}}
{{- end -}}
{{- if not $found -}}
{{- $resources = append $resources (set $target "createIfMissing" true) -}}
{{- end -}}
{{- end -}}
{{- $_ := set $sync "resources" $resources -}}
{{- $_ := set $values "podplane-operator" (mergeOverwrite $operatorValues (dict "podplane" (dict "operator" (dict "config" (dict "workloadCertificates" (dict "trustBundleSync" $sync)))))) -}}
{{- /* Client certificate SAN matchers use the operator's SPIFFE trust domain. */ -}}
{{- $trustDomain := dig "podplane" "operator" "config" "cluster" "spiffe" "trustDomain" "" $operatorValues -}}
{{- if and $trustDomain (not (dig "platform" "agentRouter" "spiffeTrustDomain" "" $agentValues)) -}}
{{- $_ := set $values "agent-router" (mergeOverwrite $agentValues (dict "platform" (dict "agentRouter" (dict "spiffeTrustDomain" $trustDomain)))) -}}
{{- end -}}
{{- end -}}

{{ range $name, $entry := $components.apps }}
{{- if $entry.enabled }}
{{- $ingressProvider := "" -}}
{{- if eq $name "envoy-gateway" -}}
{{- $ingressProvider = dig "platform" "envoyGateway" "ingress" "certificates" "provider" "" (index $values $name | default dict) -}}
{{- end }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name }}
  namespace: {{ $entry.namespace }}
spec:
  interval: {{ $interval }}
  maxHistory: 3
  releaseName: {{ include "podplane.platform.releaseName" $name }}
  chart:
    spec:
      chart: ./charts/{{ $name }}
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: podplane-components
        namespace: {{ $sourceNs }}
  install:
    crds: Skip
    remediation:
      retries: 10
  upgrade:
    crds: Skip
    remediation:
      retries: 3
{{- with $entry.dependsOn }}
  dependsOn:
{{- range . }}
{{- if not (and (eq $name "envoy-gateway") (eq $ingressProvider "node") (eq . "secrets-store-csi-driver")) }}
    - name: {{ . }}
{{- /* CRDs live in platform-cluster; apps live in their own namespace; default to source namespace if unknown */ -}}
{{- $depCrd := index $components.crds . }}
{{- $depApp := index $components.apps . }}
{{- if $depCrd }}
      namespace: platform-cluster
{{- else if $depApp }}
      namespace: {{ $depApp.namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if eq $name "podplane-operator" }}
{{- $operatorValues := index $values $name | default dict -}}
{{- $secrets := dig "podplane" "operator" "config" "secrets" dict $operatorValues -}}
{{- $providerName := required "platform.components.values.podplane-operator.podplane.operator.config.secrets.defaultProvider is required" (get $secrets "defaultProvider") -}}
{{- $providers := get $secrets "providers" | default dict -}}
{{- $provider := get $providers $providerName | default dict -}}
{{- $providerKind := required (printf "platform.components.values.podplane-operator.podplane.operator.config.secrets.providers.%s.kind is required" $providerName) (get $provider "kind") -}}
{{- if not (has $providerKind (list "aws" "gcp" "vault" "openbao")) -}}
{{- fail (printf "podplane-operator workload certificates require an aws, gcp, vault, or openbao default provider, got %q" $providerKind) -}}
{{- end }}
{{- $providerComponent := printf "secrets-store-csi-provider-%s" $providerKind }}
    - name: {{ $providerComponent }}
      namespace: {{ (index $components.apps $providerComponent).namespace }}
{{- end }}
{{ if and (eq $name "envoy-gateway") (ne $ingressProvider "node") (dig "platform" "envoyGateway" "ingress" "enabled" false (index $values $name | default dict)) }}
{{- $providerKind := required "platform.components.values.envoy-gateway.platform.envoyGateway.ingress.certificates.provider is required" $ingressProvider }}
{{- if not (has $providerKind (list "aws" "gcp" "vault" "openbao")) -}}
{{- fail (printf "envoy-gateway ingress certificates require a node, aws, gcp, vault, or openbao provider, got %q" $providerKind) -}}
{{- end }}
{{- $providerComponent := printf "secrets-store-csi-provider-%s" $providerKind }}
    - name: {{ $providerComponent }}
      namespace: {{ (index $components.apps $providerComponent).namespace }}
{{- end }}
{{ include "podplane.platform.values" (dict "name" $name "values" $values "mirrorEnabled" $mirrorEnabled "mirrorHostname" $mirrorHostname "mirrorPrefix" $mirrorPrefix) }}
{{- end }}
{{- end }}
