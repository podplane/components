---
platform:
  components:
    # Defaults for component Flux HelmReleases rendered by this chart.
    helmRelease:
      interval: 10m

    # Component image mirror settings. When enabled, platform-components injects
    # explicit chart values so component images are pulled from
    # <hostname>/<prefix>/<original-registry>/<repository>. This is platform plumbing;
    # component chart values belong under `platform.components.values.<component-name>`.
    imageMirror:
      enabled: false
      hostname: ""
      # Trimmed of leading/trailing slashes. Empty means no prefix.
      prefix: mirror

    # CRDs - shipped as separate Helm charts per Helm best practices.
    # `core: true` marks entries so that the Podplane CLI will refuse to uninstall them.
    crds:
      cilium-crds:
        enabled: true
        core: true
      gateway-api-crds:
        enabled: true
        core: true
      fluxcd-crds:
        enabled: true
        core: true
      # Addon CRDs (default disabled; enable together with the matching app)
      agent-router-crds:
        enabled: false
      cluster-api-crds:
        enabled: false
        core: true
      nstance-operator-crds:
        enabled: false
        core: true
      agent-sandbox-crds:
        enabled: false
      podplane-operator-crds:
        enabled: false
      envoy-gateway-crds:
        enabled: false
      snapshot-crds:
        enabled: false
      secrets-store-csi-driver-crds:
        enabled: false

    # Apps
    # `core: true` marks entries so that the Podplane CLI will refuse to uninstall them.
    # `podSecurity` sets the Pod Security Admission level enforced in the app's
    # namespace: privileged, baseline, or restricted.
    # `runcAllowed: true` labels the app namespace runtime.podplane.dev/runc=allowed.
    # Pods default to gVisor; components that need host integration gVisor
    # cannot provide also have their namespace in platform-runtime's
    # runcDefaultNamespaces, which defaults their Pods to runc.
    apps:
      # Core
      platform-rbac:
        enabled: true
        core: true
        namespace: platform-cluster
      platform-runtime:
        enabled: true
        core: true
        namespace: platform-cluster
      cilium:
        enabled: true
        core: true
        namespace: platform-cilium
        # Cilium manages node networking: privileged containers, hostNetwork,
        # hostPath mounts, and added capabilities.
        podSecurity: privileged
        runcAllowed: true
        dependsOn:
          - cilium-crds
      coredns:
        enabled: true
        core: true
        namespace: platform-coredns
        # hostPath mount of the node's systemd-resolved resolv.conf for upstream DNS.
        # A read-only host file works under gVisor, so CoreDNS keeps the default.
        podSecurity: privileged
        dependsOn:
          - cilium
      fluxcd:
        enabled: true
        core: true
        namespace: platform-fluxcd
        podSecurity: restricted
        dependsOn:
          - fluxcd-crds
      # Provider-specific core components (default disabled unless selected by cluster configuration)
      cluster-api:
        enabled: false
        core: true
        namespace: platform-cluster-api
        podSecurity: restricted
        dependsOn:
          - cluster-api-crds
          - podplane-operator
      nstance-operator:
        enabled: false
        core: true
        namespace: platform-nstance-operator
        podSecurity: restricted
        dependsOn:
          - nstance-operator-crds
          - cluster-api
      csi-aws-ebs:
        enabled: false
        core: true
        namespace: platform-csi-aws-ebs
        # The node plugin attaches and mounts volumes: a privileged container and
        # hostPath mounts of kubelet and device directories.
        podSecurity: privileged
        runcAllowed: true
      podplane-operator:
        enabled: false
        namespace: platform-podplane-operator
        podSecurity: restricted
        dependsOn:
          - podplane-operator-crds
          - secrets-store-csi-driver
      secrets-store-csi-driver:
        enabled: false
        namespace: platform-secrets-store-csi-driver
        # The node plugin mounts secrets into Pods: a privileged container and
        # hostPath mounts of kubelet and provider socket directories.
        podSecurity: privileged
        runcAllowed: true
        dependsOn:
          - secrets-store-csi-driver-crds
      secrets-store-csi-provider-aws:
        enabled: false
        namespace: platform-secrets-store-csi-provider-aws
        # hostPath mount of the CSI driver's provider socket directory.
        podSecurity: privileged
        runcAllowed: true
        dependsOn:
          - secrets-store-csi-driver
      secrets-store-csi-provider-gcp:
        enabled: false
        namespace: platform-secrets-store-csi-provider-gcp
        # hostPath mount of the CSI driver's provider socket directory.
        podSecurity: privileged
        runcAllowed: true
        dependsOn:
          - secrets-store-csi-driver
      secrets-store-csi-provider-vault:
        enabled: false
        namespace: platform-secrets-store-csi-provider-vault
        # hostPath mount of the CSI driver's provider socket directory.
        podSecurity: privileged
        runcAllowed: true
        dependsOn:
          - secrets-store-csi-driver
      secrets-store-csi-provider-openbao:
        enabled: false
        namespace: platform-secrets-store-csi-provider-openbao
        # hostPath mount of the CSI driver's provider socket directory.
        podSecurity: privileged
        runcAllowed: true
        dependsOn:
          - secrets-store-csi-driver
      # Addons (default disabled)
      agent-router:
        enabled: false
        namespace: platform-agent-router
        podSecurity: restricted
        dependsOn:
          - agent-router-crds
          - envoy-gateway
      agent-sandbox:
        enabled: false
        namespace: platform-agent-sandbox
        podSecurity: restricted
        dependsOn:
          - agent-sandbox-crds
      envoy-gateway:
        enabled: false
        namespace: platform-envoy-gateway
        # The platform Gateway's Envoy Pods bind hostPort 443 and, with node
        # certificates, mount /opt/podplane/secrets/ingress via hostPath. Host
        # ports and polled read-only host files work under gVisor, so the
        # proxies and controller keep the default.
        podSecurity: privileged
        dependsOn:
          - envoy-gateway-crds
          - gateway-api-crds
          - secrets-store-csi-driver
          - podplane-operator
      cluster-autoscaler:
        enabled: false
        namespace: platform-cluster-autoscaler
        podSecurity: restricted
        dependsOn:
          - nstance-operator
      snapshot:
        enabled: false
        namespace: platform-snapshot
        podSecurity: restricted
        dependsOn:
          - snapshot-crds
      metrics-server:
        enabled: false
        namespace: platform-metrics-server
        podSecurity: restricted
      node-problem-detector:
        enabled: false
        namespace: platform-node-problem-detector
        # A privileged container and hostPath mounts of node logs, the journal,
        # and the containerd socket to detect node problems.
        podSecurity: privileged
        runcAllowed: true
      zot-registry:
        enabled: false
        namespace: platform-zot-registry
        podSecurity: restricted

    # Per-component values merged into each HelmRelease's `values:`.
    # Keys must match entries in `platform.components.{apps,crds}`. Component
    # configuration belongs here, using that component chart's values shape.
    values: {}
    # Example:
    # values:
    #   envoy-gateway:
    #     platform:
    #       envoyGateway:
    #         ingress:
    #           enabled: true
    #           domains:
    #             - apex: example.com
