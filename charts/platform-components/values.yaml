---
platform:
  components:
    # Default reconciliation interval for component HelmReleases.
    reconcileInterval: 10m

    registry:
      # Component image mirror settings. When enabled, platform injects explicit
      # chart values so component images are pulled from
      # <hostname>/<original-registry>/<repository>.
      mirror:
        enabled: false
        hostname: ""

    # CRDs - shipped as separate Helm charts per Helm best practices.
    # `core: true` marks entries so that the Podplane CLI will refuse to uninstall them.
    crds:
      cilium-crds:
        enabled: true
        core: true
      gateway-api-crds:
        enabled: true
        core: true
      fluxcd-crds:
        enabled: true
        core: true
      # Addon CRDs (default disabled; enable together with the matching app)
      agent-sandbox-crds:
        enabled: false
      cert-manager-crds:
        enabled: false
      trust-manager-crds:
        enabled: false
      traefik-crds:
        enabled: false
      snapshot-crds:
        enabled: false

    # Apps
    # `core: true` marks entries so that the Podplane CLI will refuse to uninstall them.
    apps:
      # Core
      platform-rbac:
        enabled: true
        core: true
        namespace: platform-cluster
      cilium:
        enabled: true
        core: true
        namespace: platform-cilium
        # Namespace pre-created by bootstrap.sh (helm install --create-namespace).
        manageNamespace: false
        dependsOn:
          - cilium-crds
      coredns:
        enabled: true
        core: true
        namespace: platform-coredns
        dependsOn:
          - cilium
      fluxcd:
        enabled: true
        core: true
        namespace: platform-fluxcd
        # Namespace pre-created by bootstrap.sh (helm install --create-namespace).
        manageNamespace: false
        dependsOn:
          - fluxcd-crds
      # Provider-specific core components (default disabled unless selected by cluster configuration)
      csi-aws-ebs:
        enabled: false
        core: true
        namespace: platform-csi-aws-ebs
      # Addons (default disabled)
      agent-sandbox:
        enabled: false
        namespace: platform-agent-sandbox
        dependsOn:
          - agent-sandbox-crds
      cert-manager:
        enabled: false
        namespace: platform-cert-manager
        dependsOn:
          - cert-manager-crds
      platform-certs:
        enabled: false
        namespace: platform-certs
        dependsOn:
          - cert-manager
      trust-manager:
        enabled: false
        namespace: platform-trust-manager
        dependsOn:
          - trust-manager-crds
          - platform-certs
      platform-trust:
        enabled: false
        namespace: platform-trust
        dependsOn:
          - trust-manager
      traefik:
        enabled: false
        namespace: platform-traefik
        dependsOn:
          - platform-certs
          - traefik-crds
          - gateway-api-crds
      snapshot:
        enabled: false
        namespace: platform-snapshot
        dependsOn:
          - snapshot-crds

    # Per-component values overrides merged into each HelmRelease's `values:`.
    # Keys must match the entries in `platform.components.{apps,crds}` above.
    values: {}
    # Example:
    # values:
    #   platform-certs:
    #     platform:
    #       certs:
    #         acme:
    #           enabled: true
    #           server: https://acme-v02.api.letsencrypt.org/directory
    #           email: ops@example.com
    #           solvers:
    #             - dnsZones:
    #                 - example.com
    #               route53:
    #                 hostedZoneID: Z123456789
    #                 roleArn: arn:aws:iam::123456789012:role/podplane-cert-manager-dns01
    #   traefik:
    #     platform:
    #       traefik:
    #         ingress:
    #           enabled: true
    #           domains:
    #             - zone: example.com
