# Default values for nstance-operator

# Operator image configuration
image:
  repository: ghcr.io/nstance-dev/nstance-operator
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""
imagePullSecrets: []

# Number of replicas (leader election ensures only one is active at any given time)
replicaCount: 2

# Cluster CA used to authenticate nstance-server. When enabled is false, an
# existing ConfigMap with a ca.crt key must be supplied.
clusterCA:
  enabled: false
  name: nstance-cluster-ca
  certificate: ""

# Registration nonce used only for the operator's initial registration.
# References an existing dedicated Secret, not nonce bytes in Helm values.
# The operator deletes it after durable registration.
registrationSecret:
  name: nstance-operator-nonce
  # Upstream currently supports only this key; other keys fail rendering.
  key: nonce.jwt

# Names for secrets that will be auto-created by the operator
managedSecretNames:
  # Operator's private key
  privateKey: nstance-operator-key
  # Operator's client certificate from server
  clientCert: nstance-operator-cert

# Configuration for the operator ConfigMap
operatorConfigMap:
  enabled: true
  name: ""

# Operator configuration rendered into config.yaml when the ConfigMap is enabled
config:
  clusterID: ""
  tenant: ""
  shards: {}
  # Example:
  #   us-east-1a:
  #     registration_addr: "172.16.0.100:8992"
  #     operator_addr: "172.16.0.100:8993"
  #   us-east-1b:
  #     registration_addr: "172.16.1.100:8992"
  #     operator_addr: "172.16.1.100:8993"
  # Automatic cluster sleep settings.
  sleep:
    enabled: true
    remainingNodes: 1
    inactivity: 30m
    activityWindows: {}
    cronLookAhead: 10m
    wakeLead: 2m
    reconcilePeriod: 1m

# Deployment configuration
deployment:
  enabled: true

# Leader election settings
leaderElection:
  enabled: true

# Metrics server configuration
metrics:
  enabled: true
  port: 8080
  service:
    enabled: true
    annotations: {}

# Health probe configuration
healthProbe:
  port: 8081

# Validating webhook configuration
webhooks:
  enabled: true
  failurePolicy: Fail

# Validate sleep requests and protect operator-owned progress on this cluster.
# Permission to request sleep is determined by ordinary CAPI Cluster RBAC.
sleepAdmissionPolicy:
  enabled: true

# Log level (debug, info, error, panic, or a positive verbosity integer string)
logLevel: info

# Service account configuration
serviceAccount:
  enabled: true
  annotations: {}
  name: ""

# RBAC configuration
rbac:
  enabled: true

# CAPI workload-cluster access. For self-managed clusters, the operator mints
# tokens for this ServiceAccount. For an external workload cluster, set
# endpoint and pre-provision the <clusterID>--<tenant>-kubeconfig Secret.
capi:
  endpoint: ""
  serviceAccount:
    enabled: true
    name: ""

# Use JSON rather than protobuf when talking to the Kubernetes API.
kubernetesJSON: false

# Pod resource limits
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# The final node must host the operator and API datastore. Two replicas retain
# normal availability; preferred (not required) spreading allows one node.
nodeSelector:
  node-role.kubernetes.io/control-plane: ""

# Tolerations
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nstance-operator

# Pod security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
