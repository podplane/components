{{- /*
Podplane <https://podplane.dev>
Copyright The Podplane Authors
SPDX-License-Identifier: Apache-2.0

Workaround for https://github.com/cert-manager/approver-policy/issues/667.
Remove once the upstream chart grants the approver-policy controller permission
to create its webhook TLS Secret.
*/ -}}
{{- $approver := index .Values "cert-manager-approver-policy" -}}
{{- $approverName := default "platform-cert-manager-approver-policy" $approver.nameOverride -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $approverName }}-secret-create
  namespace: {{ .Release.Namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $approverName }}-secret-create
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $approverName }}-secret-create
subjects:
  - kind: ServiceAccount
    name: {{ $approverName }}
    namespace: {{ .Release.Namespace | quote }}
