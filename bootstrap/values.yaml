---
bootstrap:
  # Select the additional platform-components CRDs/apps to install:
  #   minimal     - core only; no addon overrides are rendered.
  #   platform    - core + envoy gateway, podplane-operator,
  #                 secrets-store-csi-driver, OpenBao secrets provider, Zot.
  #   agentic     - platform + Agent Sandbox and its CRDs.
  #   all         - every addon CRD/app listed below.
  install: minimal
  clusterID: default
  spiffeTrustDomain: ""
  domain: ""
  registry:
    hostname: ""
    # s3 or gcs; see charts/zot-registry values.
    driver: s3
    bucket: registry
    region: local
    endpoint: ""
    forcePathStyle: false
    secure: true
    accessKeyID: ""
    secretAccessKey: ""
  oidc:
    issuer: ""
    audience: ""
    usernameClaim: email
    groupsClaim: groups
  secrets:
    localFakeVault:
      address: ""
      caCert: "" # Base64-encoded CA certificate PEM
  flux:
    git:
      url: https://github.com/podplane/components.git
      secretRefName: ""
      caCert: "" # Base64-encoded CA certificate PEM
      ref:
        branch: ""
        tag: ""
        commit: ""
        semver: "^2.0.0"
  addons:
    crds:
      - name: agent-sandbox-crds
        install: [agentic, all]
      - name: podplane-operator-crds
        install: [platform, agentic, all]
      - name: secrets-store-csi-driver-crds
        install: [platform, agentic, all]
      - name: envoy-gateway-crds
        install: [platform, agentic, all]
      - name: snapshot-crds
        install: [all]
    apps:
      - name: agent-sandbox
        install: [agentic, all]
      - name: podplane-operator
        install: [platform, agentic, all]
      - name: secrets-store-csi-driver
        install: [platform, agentic, all]
      - name: secrets-store-csi-provider-aws
        install: [all]
      - name: secrets-store-csi-provider-gcp
        install: [all]
      - name: secrets-store-csi-provider-vault
        install: [all]
      - name: secrets-store-csi-provider-openbao
        install: [platform, agentic, all]
      - name: envoy-gateway
        install: [platform, agentic, all]
      - name: snapshot
        install: [all]
      - name: metrics-server
        install: [all]
      - name: node-problem-detector
        install: [all]
      - name: cluster-autoscaler
        install: [all]
      - name: zot-registry
        install: [platform, agentic, all]
