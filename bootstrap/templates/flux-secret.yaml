{{- if .Values.bootstrap.flux.git.caCert }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.bootstrap.flux.git.secretRefName }}
  namespace: platform-components
type: Opaque
data:
  ca.crt: {{ .Values.bootstrap.flux.git.caCert }}
{{- end }}
