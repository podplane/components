apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform-components
  namespace: platform-components
spec:
  interval: 10m
  maxHistory: 3
  releaseName: platform-components
  chart:
    spec:
      chart: ./charts/platform-components
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: podplane-components
        namespace: platform-components
  values:
    platform:
      components:
{{- if .Values.bootstrap.registry.hostname }}
        imageMirror:
          enabled: true
          hostname: {{ .Values.bootstrap.registry.hostname }}
          prefix: mirror
{{- end }}
{{- if or (eq .Values.bootstrap.install "recommended") (eq .Values.bootstrap.install "all") }}
        crds:
{{- range .Values.bootstrap.addons.crds }}
{{- if has $.Values.bootstrap.install .install }}
          {{ .name }}:
            enabled: true
{{- end }}
{{- end }}
        apps:
{{- range .Values.bootstrap.addons.apps }}
{{- if has $.Values.bootstrap.install .install }}
          {{ .name }}:
            enabled: true
{{- end }}
{{- end }}
{{- end }}
        values:
          podplane-operator:
            podplane:
              operator:
                config:
                  cluster:
                    id: {{ .Values.bootstrap.clusterID | quote }}
                    spiffe:
                      trustDomain: {{ .Values.bootstrap.spiffeTrustDomain | quote }}
                    oidc:
                      issuerURL: {{ .Values.bootstrap.oidc.issuer | quote }}
                      clientID: {{ .Values.bootstrap.oidc.audience | default .Values.bootstrap.clusterID | quote }}
                      usernameClaim: {{ .Values.bootstrap.oidc.usernameClaim | quote }}
                      groupsClaim: {{ .Values.bootstrap.oidc.groupsClaim | quote }}
{{- if .Values.bootstrap.secrets.localFakeVault.address }}
                  secrets:
                    defaultProvider: local-fakevault
                    providers:
                      local-fakevault:
                        kind: openbao
                        address: {{ .Values.bootstrap.secrets.localFakeVault.address | quote }}
                        mountPath: secret
{{- if .Values.bootstrap.secrets.localFakeVault.caCert }}
                        caCert: {{ .Values.bootstrap.secrets.localFakeVault.caCert | b64dec | quote }}
{{- end }}
{{- if .Values.bootstrap.domain }}
                  ingressCertificates:
                    provider: local-fakevault
                    keyPrefix: {{ .Values.bootstrap.clusterID | quote }}
                    domains:
                      {{ .Values.bootstrap.domain | quote }}: {}
          envoy-gateway:
            platform:
              envoyGateway:
                ingress:
                  enabled: true
                  domains:
                    - apex: {{ .Values.bootstrap.domain | quote }}
                  certificates:
                    provider: openbao
                    address: {{ .Values.bootstrap.secrets.localFakeVault.address | quote }}
                    mountPath: secret
                    keyPrefix: {{ .Values.bootstrap.clusterID | quote }}
{{- if .Values.bootstrap.secrets.localFakeVault.caCert }}
                    caCertPath: /var/run/podplane/secrets-providers/local-fakevault/ca.crt
{{- end }}
{{- end }}
          secrets-store-csi-provider-openbao:
            podplane:
              secrets:
                providers:
                  local-fakevault:
{{- if .Values.bootstrap.secrets.localFakeVault.caCert }}
                    caCert: {{ .Values.bootstrap.secrets.localFakeVault.caCert | b64dec | quote }}
            openbao:
              csi:
                volumes:
                  - name: provider-ca-local-fakevault
                    configMap:
                      name: podplane-secrets-provider-ca-local-fakevault
                volumeMounts:
                  - name: provider-ca-local-fakevault
                    mountPath: /var/run/podplane/secrets-providers/local-fakevault
                    readOnly: true
{{- else }}
                    caCert: ""
{{- end }}
{{- end }}
          zot-registry:
            platform:
              zotRegistry:
                registryHostname: {{ .Values.bootstrap.registry.hostname | quote }}
                storage:
                  bucket: {{ .Values.bootstrap.registry.bucket | quote }}
                  region: {{ .Values.bootstrap.registry.region | quote }}
                  endpoint: {{ .Values.bootstrap.registry.endpoint | quote }}
                  forcePathStyle: {{ .Values.bootstrap.registry.forcePathStyle }}
                  secure: {{ .Values.bootstrap.registry.secure }}
                  accessKeyID: {{ .Values.bootstrap.registry.accessKeyID | quote }}
                  secretAccessKey: {{ .Values.bootstrap.registry.secretAccessKey | quote }}
                oidc:
                  issuer: {{ .Values.bootstrap.oidc.issuer | quote }}
                  audience: {{ .Values.bootstrap.oidc.audience | default .Values.bootstrap.clusterID | quote }}
                  usernameClaim: {{ .Values.bootstrap.oidc.usernameClaim | quote }}
                  groupsClaim: {{ .Values.bootstrap.oidc.groupsClaim | quote }}
