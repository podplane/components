# Copyright The Podplane Authors
# SPDX-License-Identifier: Apache-2.0
#
# Release workflow: attaches Helm packages and a signed manifest to a new release.
#
# For tag vX.Y.Z (or vX.Y.Z-rcN for pre-releases), this:
#   1. Validates manifests/components.json against renders and both architectures.
#   2. Renders components_X.Y.Z.json with components.version set to X.Y.Z
#      and components.source.ref.tag set to vX.Y.Z; packages all charts at X.Y.Z.
#   3. Writes components_X.Y.Z_checksums.txt (sha512) covering release assets
#      and signs it keyless with cosign, producing a self-contained bundle.
#   4. Creates a new GitHub Release with charts, manifest, checksums, and bundle.
#      Existing releases are never updated or their assets overwritten.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Derive VERSION and pre-release flag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Validate manifest and prepare chart packages and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: make release-assets

      - name: Sign checksums file with cosign
        working-directory: dist/release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cosign sign-blob \
            --yes \
            --bundle="components_${VERSION}_checksums.txt.bundle" \
            "components_${VERSION}_checksums.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          # gh release create fails if the release exists, unlike an update action.
          gh release create "$GITHUB_REF_NAME" dist/release/* "${args[@]}"

      - name: Create deps app token
        id: deps-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PODPLANE_DEPS_APP_ID }}
          private-key: ${{ secrets.PODPLANE_DEPS_APP_PRIVATE_KEY }}
          owner: podplane
          repositories: deps

      - name: Trigger deps sync
        env:
          GH_TOKEN: ${{ steps.deps-app.outputs.token }}
        run: |
          gh workflow run sync.yml \
            --repo podplane/deps \
            --ref main \
            -f source_repo="${GITHUB_REPOSITORY}" \
            -f source_ref="${GITHUB_REF_NAME}"
