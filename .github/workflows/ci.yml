name: ci
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Check formatting, lint, validate, and test
        run: make ci
